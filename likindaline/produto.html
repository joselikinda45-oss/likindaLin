<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15191f" />
    <link rel="icon" href="img/logo-mark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Manrope:wght@700;800&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Produto | LikindaLine</title>
    <meta
      name="description"
      content="Consulta fotografias, preço em kwanzas e disponibilidade deste produto da LikindaLine."
    />
    <meta property="og:type" content="product" />
    <meta property="og:site_name" content="LikindaLine" />
    <meta property="og:locale" content="pt_AO" />
    <meta property="og:title" content="Produto | LikindaLine" />
    <meta
      property="og:description"
      content="Consulta fotografias, preço em kwanzas e disponibilidade."
    />
    <meta property="og:url" content="" />
    <meta
      property="og:image"
      content="https://SEU-DOMINIO.vercel.app/img/og-likindaline.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="product-page">
    <a class="skip-link" href="#main-content">Saltar para o conteúdo</a>
    <header class="site-header">
      <a
        class="brand"
        href="index.html"
        aria-label="LikindaLine — página inicial"
        ><img class="brand-mark" src="img/logo-mark.png" alt="" aria-hidden="true" /><span
          >Likinda<span class="brand-accent">Line</span></span
        ></a
      >
      <a class="back-link" href="index.html">&larr; Voltar à loja</a>
      <a
        class="button header-whatsapp wa-btn"
        data-whatsapp
        href="#"
        aria-label="Falar connosco pelo WhatsApp"
        ><img class="whatsapp-icon" src="img/whatsapp.svg" alt="" /><span class="wa-label">WhatsApp</span></a
      >
    </header>
    <main class="product-detail-wrap" id="main-content">
      <nav class="breadcrumbs" aria-label="Localização">
        <a href="index.html">Início</a><span aria-hidden="true">/</span
        ><span id="crumb-product">Produto</span>
      </nav>
      <article id="product-detail" class="product-detail">
        <p class="loading-state">A carregar produto...</p>
      </article>
      <section
        class="related-section"
        id="related-section"
        aria-labelledby="related-title"
      >
        <div class="section-heading">
          <div>
            <h2 id="related-title">
              Também podes gostar<span class="orange-dot">.</span>
            </h2>
          </div>
        </div>
        <div class="product-grid" id="related-grid"></div>
      </section>
    </main>
    <footer class="site-footer">
      <a class="brand footer-brand" href="index.html"
        ><img class="brand-mark" src="img/logo-mark.png" alt="" aria-hidden="true" /><span
          >Likinda<span class="brand-accent">Line</span></span
        ></a
      >
      <p>Encomendas e informações pelo WhatsApp.</p>
      <span>&copy; <span data-year></span> LikindaLine.</span>
    </footer>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/produto.js"></script>
  </body>
</html>
